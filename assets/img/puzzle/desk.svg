    <path d="M78 510h40" stroke="#E8A66F" stroke-width="3" stroke-linecap="round"/>
    <circle cx="160" cy="510" r="9" fill="none" stroke="#E8A66F" stroke-width="2.5"/>
  </g>
  <g transform="rotate(28 230 470)">
    <rect x="214" y="420" width="12" height="104" rx="4" fill="#E8A66F"/>
    <path d="M214 524h12l-6 14z" fill="#304157"/>
    <rect x="214" y="420" width="12" height="14" rx="3" fill="#304157"/>
