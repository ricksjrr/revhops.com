    <g stroke="#C6D3E0" stroke-width="2"><path d="M74 458h108M74 478h108M74 498h108M74 518h108"/></g>
    <path d="M78 470c8-10 14 4 22-4s12 2 20-2" fill="none" stroke="#304157" stroke-width="2.5" stroke-linecap="round"/>
