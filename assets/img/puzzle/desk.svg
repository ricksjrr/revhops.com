  </g>
  <rect x="44" y="46" width="170" height="130" rx="3" fill="#FAFAF8"/>
  <text x="58" y="70" font-size="13" font-weight="700" fill="#304157">ARR</text>
  <path d="M58 156h140" stroke="#C6D3E0" stroke-width="2"/>
  <path d="M60 148L90 138L116 142L144 118L170 106L196 82" fill="none" stroke="#E8A66F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M184 80l14 1-4 13" fill="none" stroke="#E8A66F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="150" y="56" width="52" height="18" rx="5" fill="#304157"/>
  <text x="176" y="69" text-anchor="middle" font-size="10" font-weight="700" fill="#F2C39B">+32%</text>

