    <rect x="296" y="290" width="44" height="14" rx="4" fill="#EEF2F6"/><text x="318" y="300.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#304157">Lead</text>
    <circle cx="190" cy="324" r="9" fill="#304157"/><rect x="206" y="318" width="66" height="6" rx="3" fill="#304157"/><rect x="206" y="328" width="50" height="5" rx="2.5" fill="#A9B8CB"/>
    <rect x="296" y="318" width="44" height="14" rx="4" fill="#F1F6F1"/><text x="318" y="328.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#5C7A5C">Customer</text>
