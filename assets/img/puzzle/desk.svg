    <rect x="296" y="234" width="44" height="14" rx="4" fill="#F1F6F1"/><text x="318" y="244.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#5C7A5C">Customer</text>
    <circle cx="190" cy="268" r="9" fill="#F2C39B"/><rect x="206" y="262" width="60" height="6" rx="3" fill="#304157"/><rect x="206" y="272" width="54" height="5" rx="2.5" fill="#A9B8CB"/>
