  <g transform="rotate(10 520 510)">
    <g filter="url(#sh)"><rect x="474" y="430" width="92" height="156" rx="14" fill="#1C2635"/></g>
    <rect x="482" y="440" width="76" height="136" rx="8" fill="#304157"/>
    <rect x="488" y="454" width="64" height="40" rx="7" fill="#FAFAF8"/>
    <circle cx="500" cy="466" r="6" fill="#F2C39B"/>
    <rect x="510" y="462" width="36" height="5" rx="2.5" fill="#304157"/>
    <rect x="494" y="478" width="52" height="5" rx="2.5" fill="#A9B8CB"/>
    <text x="520" y="522" text-anchor="middle" font-size="11" font-weight="700" fill="#F2C39B">Deal won</text>
    <text x="520" y="540" text-anchor="middle" font-size="15" font-weight="700" fill="#FAFAF8">$48k</text>
