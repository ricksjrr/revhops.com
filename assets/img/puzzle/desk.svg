  <g transform="rotate(-4 300 110)" filter="url(#sh)">
    <rect x="258" y="54" width="78" height="74" fill="#F2C39B"/>
  </g>
  <text x="292" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#304157" transform="rotate(-4 300 110)">NRR</text>
  <g transform="rotate(5 380 120)" filter="url(#sh)">
    <rect x="348" y="70" width="74" height="70" fill="#C6D3E0"/>
  </g>
  <text x="385" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#304157" transform="rotate(5 380 120)">CAC</text>
  <g transform="rotate(3 300 170)" filter="url(#sh)">
    <rect x="286" y="136" width="62" height="24" fill="#FAFAF8"/>
