<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" font-family="Ubuntu, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE5EE"/>
      <stop offset="1" stop-color="#EEF2F6"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFD6BC"/>
      <stop offset="1" stop-color="#E6C29F"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAFAF8"/>
      <stop offset="1" stop-color="#EEF2F6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1C2635" flood-opacity=".2"/>
    </filter>
  </defs>

  <!-- wall -->
  <rect width="600" height="390" fill="url(#wall)"/>
  <circle cx="300" cy="250" r="190" fill="#F2C39B" opacity=".28"/>

  <!-- framed chart, top left -->
