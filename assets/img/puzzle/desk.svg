    <path d="M118 300h14a18 18 0 0 1 0 36h-10" fill="none" stroke="#304157" stroke-width="8"/>
    <path d="M44 280h80v88a14 14 0 0 1-14 14H58a14 14 0 0 1-14-14z" fill="#304157"/>
