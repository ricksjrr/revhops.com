  <rect x="352" y="232" width="66" height="120" rx="6" fill="#FFFFFF" stroke="#E6E9EE"/>
  <rect x="360" y="312" width="10" height="30" rx="2" fill="#C6D3E0"/>
  <rect x="374" y="296" width="10" height="46" rx="2" fill="#6B7A93"/>
  <rect x="388" y="280" width="10" height="62" rx="2" fill="#304157"/>
  <rect x="402" y="258" width="10" height="84" rx="2" fill="#F2C39B"/>
  <text x="360" y="249" font-size="9" font-weight="700" fill="#6B7A93">MRR</text>

