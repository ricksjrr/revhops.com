<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" font-family="Ubuntu, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4EBF3"/>
      <stop offset="1" stop-color="#C6D3E0"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2C39B" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F2C39B" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1C2635" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="560" cy="40" r="120" fill="#F2C39B" opacity=".35"/>
  <circle cx="30" cy="590" r="140" fill="#FAFAF8" opacity=".5"/>

  <!-- window -->
  <g filter="url(#sh)">
    <rect x="18" y="18" width="564" height="564" rx="18" fill="#FAFAF8"/>
  </g>
  <path d="M18 36a18 18 0 0 1 18-18h528a18 18 0 0 1 18 18v28H18z" fill="#1C2635"/>
  <circle cx="44" cy="41" r="6" fill="#F2C39B"/>
  <circle cx="64" cy="41" r="6" fill="#C6D3E0"/>
  <circle cx="84" cy="41" r="6" fill="#6B7A93"/>
  <rect x="200" y="31" width="200" height="20" rx="7" fill="#304157"/>
  <text x="300" y="45.5" text-anchor="middle" font-size="11" fill="#C9D4E2">revenue dashboard</text>

  <!-- sidebar -->
  <path d="M18 64h86v500a18 18 0 0 1-18 18H36a18 18 0 0 1-18-18z" fill="#304157"/>
  <rect x="37" y="86" width="48" height="48" rx="12" fill="#F2C39B"/>
  <path d="M49 120v-10M61 120v-18M73 120v-24" stroke="#304157" stroke-width="6" stroke-linecap="round"/>
  <g fill="none" stroke="#A9B8CB" stroke-width="4" stroke-linecap="round">
    <circle cx="61" cy="176" r="13"/>
    <path d="M48 226h26M48 236h26M48 246h16"/>
    <rect x="47" y="282" width="28" height="24" rx="5"/>
    <path d="M61 344v26M48 357h26"/>
    <circle cx="61" cy="418" r="8"/><path d="M47 446c3-10 25-10 28 0"/>
  </g>
  <circle cx="61" cy="528" r="18" fill="#6B7A93"/>
  <circle cx="61" cy="522" r="7" fill="#C6D3E0"/>
  <path d="M49 540c4-9 20-9 24 0" fill="#C6D3E0"/>

  <!-- KPI cards -->
  <g>
    <rect x="122" y="82" width="140" height="92" rx="12" fill="#FFFFFF" stroke="#E6E9EE"/>
    <text x="138" y="108" font-size="12" fill="#6B7A93" font-weight="700">Pipeline</text>
    <text x="138" y="144" font-size="28" fill="#304157" font-weight="700">$2.4M</text>
    <path d="M212 118l10-7 8 4 14-11" fill="none" stroke="#5C7A5C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="138" y="164" font-size="11" fill="#5C7A5C" font-weight="700">+18% this month</text>

    <rect x="274" y="82" width="140" height="92" rx="12" fill="#304157"/>
    <text x="290" y="108" font-size="12" fill="#A9BDD6" font-weight="700">Win rate</text>
    <text x="290" y="144" font-size="28" fill="#FAFAF8" font-weight="700">31%</text>
    <rect x="290" y="156" width="108" height="7" rx="3.5" fill="#6B7A93"/>
    <rect x="290" y="156" width="34" height="7" rx="3.5" fill="#F2C39B"/>

    <rect x="426" y="82" width="140" height="92" rx="12" fill="#FFFFFF" stroke="#E6E9EE"/>
    <text x="442" y="108" font-size="12" fill="#6B7A93" font-weight="700">Sales cycle</text>
    <text x="442" y="144" font-size="28" fill="#304157" font-weight="700">42d</text>
    <circle cx="540" cy="134" r="14" fill="none" stroke="#C6D3E0" stroke-width="4"/>
    <path d="M540 120a14 14 0 0 1 12 21" fill="none" stroke="#F2C39B" stroke-width="4" stroke-linecap="round"/>
  </g>

