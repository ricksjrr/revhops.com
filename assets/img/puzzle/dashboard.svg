  <rect x="122" y="188" width="292" height="200" rx="12" fill="#FFFFFF" stroke="#E6E9EE"/>
  <text x="138" y="214" font-size="13" fill="#304157" font-weight="700">Closed won by month</text>
  <g stroke="#F0F2F5" stroke-width="2">
    <path d="M138 250h260M138 290h260M138 330h260"/>
  </g>
  <path d="M138 370h260" stroke="#C6D3E0" stroke-width="2"/>
  <g>
    <rect x="148" y="318" width="24" height="52" rx="4" fill="#C6D3E0"/>
    <rect x="184" y="298" width="24" height="72" rx="4" fill="#C6D3E0"/>
    <rect x="220" y="306" width="24" height="64" rx="4" fill="#6B7A93"/>
    <rect x="256" y="276" width="24" height="94" rx="4" fill="#6B7A93"/>
    <rect x="292" y="262" width="24" height="108" rx="4" fill="#304157"/>
    <rect x="328" y="244" width="24" height="126" rx="4" fill="#304157"/>
    <rect x="364" y="226" width="24" height="144" rx="4" fill="#F2C39B"/>
  </g>
  <rect x="340" y="198" width="60" height="22" rx="6" fill="#1C2635"/>
  <text x="370" y="213.5" text-anchor="middle" font-size="11" fill="#F2C39B" font-weight="700">$410k</text>

  <!-- donut -->
  <rect x="426" y="188" width="140" height="200" rx="12" fill="#FFFFFF" stroke="#E6E9EE"/>
  <text x="442" y="214" font-size="13" fill="#304157" font-weight="700">By source</text>
  <g transform="translate(496 290)" fill="none" stroke-width="18">
    <circle r="44" stroke="#C6D3E0"/>
    <circle r="44" stroke="#304157" stroke-dasharray="124 400" transform="rotate(-90)"/>
    <circle r="44" stroke="#F2C39B" stroke-dasharray="70 400" transform="rotate(72)"/>
    <circle r="44" stroke="#6B7A93" stroke-dasharray="40 400" transform="rotate(164)"/>
  </g>
  <text x="496" y="297" text-anchor="middle" font-size="20" fill="#304157" font-weight="700">68%</text>
  <circle cx="446" cy="366" r="5" fill="#304157"/><text x="455" y="370" font-size="10" fill="#6B7A93">Inbound</text>
  <circle cx="508" cy="366" r="5" fill="#F2C39B"/><text x="517" y="370" font-size="10" fill="#6B7A93">Partner</text>

  <!-- line chart -->
  <rect x="122" y="402" width="444" height="164" rx="12" fill="#FFFFFF" stroke="#E6E9EE"/>
  <text x="138" y="428" font-size="13" fill="#304157" font-weight="700">Forecast vs quota</text>
  <rect x="430" y="416" width="10" height="10" rx="2" fill="#F2C39B"/><text x="445" y="425" font-size="10" fill="#6B7A93">Forecast</text>
  <rect x="496" y="416" width="10" height="10" rx="2" fill="#304157"/><text x="511" y="425" font-size="10" fill="#6B7A93">Quota</text>
  <path d="M140 530 L200 515 L260 520 L320 492 L380 480 L440 462 L500 448 L548 440 L548 548 L140 548 Z" fill="url(#area)"/>
  <path d="M140 530 L200 515 L260 520 L320 492 L380 480 L440 462 L500 448 L548 440" fill="none" stroke="#E8A66F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M140 512 L548 470" fill="none" stroke="#304157" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round"/>
  <g fill="#FFFFFF" stroke="#E8A66F" stroke-width="3">
    <circle cx="200" cy="515" r="5"/><circle cx="320" cy="492" r="5"/><circle cx="440" cy="462" r="5"/><circle cx="548" cy="440" r="6" fill="#F2C39B"/>
  </g>
</svg>
