<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" font-family="Ubuntu, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF6EE"/>
      <stop offset="1" stop-color="#F6E3D0"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8A66F"/>
      <stop offset=".5" stop-color="#F2C39B"/>
      <stop offset="1" stop-color="#E8A66F"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1C2635" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <g fill="#E9D3BD">
    <circle cx="40" cy="60" r="3"/><circle cx="80" cy="30" r="2"/><circle cx="560" cy="80" r="3"/><circle cx="520" cy="30" r="2"/>
    <circle cx="30" cy="330" r="3"/><circle cx="575" cy="300" r="3"/>
  </g>

  <text x="28" y="44" font-size="20" font-weight="700" fill="#304157">Q3 revenue funnel</text>
  <rect x="440" y="24" width="132" height="28" rx="8" fill="#304157"/>
  <text x="506" y="43" text-anchor="middle" font-size="12" font-weight="700" fill="#F2C39B">Jul to Sep</text>

  <!-- leads dropping in -->
  <g>
    <g fill="#6B7A93"><circle cx="110" cy="86" r="9"/><path d="M96 112c2-10 26-10 28 0z"/></g>
    <g fill="#304157"><circle cx="170" cy="72" r="9"/><path d="M156 98c2-10 26-10 28 0z"/></g>
    <g fill="#E8A66F"><circle cx="232" cy="92" r="9"/><path d="M218 118c2-10 26-10 28 0z"/></g>
    <g fill="#6B7A93"><circle cx="292" cy="70" r="9"/><path d="M278 96c2-10 26-10 28 0z"/></g>
    <g fill="#304157"><circle cx="352" cy="90" r="9"/><path d="M338 116c2-10 26-10 28 0z"/></g>
    <g fill="#A9B8CB"><circle cx="412" cy="74" r="9"/><path d="M398 100c2-10 26-10 28 0z"/></g>
    <g fill="#E8A66F"><circle cx="474" cy="90" r="9"/><path d="M460 116c2-10 26-10 28 0z"/></g>
  </g>

  <!-- the funnel -->
  <g filter="url(#sh)">
    <path d="M70 130h460l-32 58H102z" fill="#C6D3E0"/>
    <path d="M105 194h390l-32 58H137z" fill="#A9B8CB"/>
    <path d="M140 258h320l-32 58H172z" fill="#6B7A93"/>
    <path d="M176 322h248l-32 58H208z" fill="#304157"/>
    <path d="M211 386h178l-32 58H243z" fill="#F2C39B"/>
  </g>
  <g font-weight="700" text-anchor="middle">
    <text x="300" y="165" font-size="17" fill="#304157">Leads</text>
    <text x="300" y="229" font-size="17" fill="#304157">MQL</text>
    <text x="300" y="293" font-size="17" fill="#FAFAF8">SQL</text>
    <text x="300" y="357" font-size="17" fill="#FAFAF8">Opportunity</text>
    <text x="300" y="421" font-size="17" fill="#304157">Won</text>
  </g>

  <!-- counts on the right -->
  <g font-weight="700" font-size="15" fill="#304157">
    <path d="M520 159h18" stroke="#C6A88C" stroke-width="2" stroke-dasharray="3 4"/><text x="544" y="164">1,200</text>
    <path d="M486 223h52" stroke="#C6A88C" stroke-width="2" stroke-dasharray="3 4"/><text x="544" y="228">480</text>
    <path d="M450 287h88" stroke="#C6A88C" stroke-width="2" stroke-dasharray="3 4"/><text x="544" y="292">190</text>
    <path d="M414 351h124" stroke="#C6A88C" stroke-width="2" stroke-dasharray="3 4"/><text x="544" y="356">72</text>
    <path d="M378 415h160" stroke="#C6A88C" stroke-width="2" stroke-dasharray="3 4"/><text x="544" y="420">24</text>
  </g>

  <!-- conversion pills on the left -->
  <g font-weight="700" font-size="12" text-anchor="middle">
    <rect x="22" y="178" width="58" height="26" rx="7" fill="#FFFFFF" stroke="#E9D3BD"/><text x="51" y="195.5" fill="#304157">40%</text>
    <rect x="56" y="242" width="58" height="26" rx="7" fill="#FFFFFF" stroke="#E9D3BD"/><text x="85" y="259.5" fill="#304157">40%</text>
    <rect x="92" y="306" width="58" height="26" rx="7" fill="#FFFFFF" stroke="#E9D3BD"/><text x="121" y="323.5" fill="#304157">38%</text>
    <rect x="126" y="370" width="58" height="26" rx="7" fill="#304157"/><text x="155" y="387.5" fill="#F2C39B">33%</text>
  </g>

  <!-- the drip into revenue -->
  <path d="M300 444v26" stroke="#E8A66F" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10"/>

  <!-- coins -->
  <g>
    <ellipse cx="300" cy="566" rx="64" ry="14" fill="#E2C5A8"/>
    <rect x="248" y="524" width="104" height="38" fill="#E8A66F"/>
    <ellipse cx="300" cy="562" rx="52" ry="12" fill="#D9955E"/>
    <ellipse cx="300" cy="524" rx="52" ry="12" fill="url(#coin)"/>
    <rect x="248" y="500" width="104" height="24" fill="#E8A66F"/>
    <ellipse cx="300" cy="500" rx="52" ry="12" fill="url(#coin)"/>
    <text x="300" y="506" text-anchor="middle" font-size="16" font-weight="700" fill="#304157">$</text>
    <g stroke="#D9955E" stroke-width="2"><path d="M248 512h104M248 537h104M248 549h104"/></g>
  </g>
  <g transform="translate(340 470) rotate(18)">
    <ellipse rx="22" ry="22" fill="url(#coin)" stroke="#D9955E" stroke-width="3"/>
    <text y="7" text-anchor="middle" font-size="20" font-weight="700" fill="#304157">$</text>
  </g>

  <!-- trophy bottom left -->
  <g transform="translate(92 494)">
    <path d="M-30 -30h60v14a30 30 0 0 1-60 0z" fill="#304157"/>
    <path d="M-30 -24h-14a14 14 0 0 0 14 22M30 -24h14a14 14 0 0 1-14 22" fill="none" stroke="#304157" stroke-width="6"/>
    <rect x="-6" y="12" width="12" height="20" fill="#304157"/>
    <rect x="-24" y="32" width="48" height="12" rx="3" fill="#1C2635"/>
    <path d="M0 -24l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z" fill="#F2C39B"/>
  </g>

  <!-- closed card bottom right -->
  <g filter="url(#sh)">
    <rect x="420" y="468" width="152" height="96" rx="12" fill="#304157"/>
  </g>
  <text x="438" y="496" font-size="12" font-weight="700" fill="#A9BDD6">Closed this quarter</text>
  <text x="438" y="532" font-size="30" font-weight="700" fill="#FAFAF8">$1.3M</text>
  <path d="M440 548h40" stroke="#F2C39B" stroke-width="5" stroke-linecap="round"/>
</svg>
